services:

  redis:
    container_name: library-redis
    restart: unless-stopped
    image: redis:7.2.1
    ports:
      - "6379:6379"
    networks:
      - library-network

  backend:
    container_name: library
    restart: always
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: >
      sh -c "
        echo 'Waiting for Django application (server volume)...' &&
        until cd /app; do sleep 1; done &&
        echo 'Applying database migrations...' &&
        until python manage.py makemigrations && python manage.py migrate; do
          echo 'Waiting for database...'; sleep 2;
        done &&
        echo 'Collecting static files...' &&
        python manage.py collectstatic --noinput &&
        echo 'Starting Django development server...' &&
        python manage.py runserver 0.0.0.0:8000
      "
    working_dir: /app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app
      - library_static_volume:/app/static
      - library_media_volume:/app/media
    networks:
      - library-network
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail http://localhost:8000/api/health/ || exit 1" ]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    container_name: library-celery-worker
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: >
      sh -c "
        echo 'Waiting for Django application (server volume)...' &&
        until cd /app; do sleep 1; done &&
        echo 'Starting Celery worker...' &&
        celery -A library.celery worker --loglevel=INFO
      "
    volumes:
      - ./src:/app
      - library_static_volume:/app/static
      - library_media_volume:/app/media
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    networks:
      - library-network

  celery-beat:
    container_name: library-celery-beat
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: >
      sh -c "
        echo 'Waiting for Django application...' &&
        until cd /app; do sleep 1; done &&
        echo 'Starting Celery Beat...' &&
        celery -A library.celery beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler  
      
      "
    volumes:
      - ./src:/app
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    networks:
      - library-network

  bot:
    container_name: library-telegram-bot
    restart: always
    build:
      context: .
      dockerfile: ./docker/bot/Dockerfile
    command: >
      sh -c "
        echo 'Starting Telegram bot...' &&
        python bot.py  
      "
    volumes:
      - ./bot:/app
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - library-network

volumes:
  library_static_volume:
  library_media_volume:
  library_postgres_data:
    driver: local

networks:
  library-network:
    driver: bridge
