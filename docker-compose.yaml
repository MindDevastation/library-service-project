version: "3.8"

services:

  redis:
    container_name: library-redis
    restart: unless-stopped
    image: redis:7.2.1
    ports:
      - "6379:6379"
    networks:
      - library-network

  backend:
    container_name: library
    restart: always
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: ["sh", "/app/scripts/backend_start.sh"]
    working_dir: /app
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app
      - library_static_volume:/app/static
      - library_media_volume:/app/media
      - scripts_volume:/app/scripts
    networks:
      - library-network
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail http://localhost:8000/api/health/ || exit 1" ]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    container_name: library-celery-worker
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: ["sh", "/app/scripts/worker_start.sh"]
    volumes:
      - ./src:/app
      - library_static_volume:/app/static
      - library_media_volume:/app/media
      - scripts_volume:/app/scripts
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    networks:
      - library-network

  celery-beat:
    container_name: library-celery-beat
    restart: unless-stopped
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: ["sh", "/app/scripts/celery_beat_start.sh"]
    volumes:
      - ./src:/app
      - scripts_volume:/app/scripts
    env_file:
      - .env
    depends_on:
      - backend
      - redis
    networks:
      - library-network

  bot:
    container_name: library-telegram-bot
    restart: always
    build:
      context: .
      dockerfile: ./docker/bot/Dockerfile
    command: ["sh", "/app/scripts/bot_start.sh"]
    working_dir: /app
    volumes:
      - ./src/telegram_bot:/app/telegram_bot
      - scripts_volume:/app/scripts
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - library-network

volumes:
  library_static_volume:
  library_media_volume:
  library_postgres_data:
    driver: local
  scripts_volume:
    driver: local

networks:
  library-network:
    driver: bridge
