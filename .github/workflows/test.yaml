name: Test

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:13
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: library
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd="pg_isready -U user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set environment variables
        run: |
          echo "POSTGRES_DB=library" >> $GITHUB_ENV
          echo "POSTGRES_USER=user" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=password" >> $GITHUB_ENV
          echo "POSTGRES_HOST=localhost" >> $GITHUB_ENV
          echo "POSTGRES_DB_PORT=5432" >> $GITHUB_ENV
          
          echo "EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend" >> $GITHUB_ENV
          echo "EMAIL_HOST=smtp.example.com" >> $GITHUB_ENV
          echo "EMAIL_PORT=587" >> $GITHUB_ENV
          echo "EMAIL_HOST_USER=email@example.com" >> $GITHUB_ENV
          echo "EMAIL_HOST_PASSWORD=password" >> $GITHUB_ENV
          echo "DEFAULT_FROM_EMAIL=email@example.com" >> $GITHUB_ENV
          
          echo "BOT_TOKEN=your_bot_token_here" >> $GITHUB_ENV
          
          echo "STRIPE_PUBLIC_KEY=your_stripe_public_key_here" >> $GITHUB_ENV
          echo "STRIPE_SECRET_KEY=your_stripe_secret_key_here" >> $GITHUB_ENV

          echo "PAYPAL_CLIENT_ID=your_paypal_client_id_here" >> $GITHUB_ENV
          echo "PAYPAL_SECRET=your_paypal_secret_here" >> $GITHUB_ENV
          echo "PAYPAL_MODE=sandbox" >> $GITHUB_ENV

      - name: Run flake8
        run: flake8 .

      - name: Run tests
        timeout-minutes: 5
        run: python src/manage.py test
        env:
          DJANGO_SETTINGS_MODULE: "library.settings"
